<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin | Kelly Mushonga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --soft:#5c5c5c; --line:#e2ded9; --alt:#f4f1ee; --accent:#e0003f; --ok:#1d7a46; --ok-bg:#e3f3ea; --warn:#8a6410; --warn-bg:#fbf0d9; --bad:#a03a3a; --bad-bg:#f4e2e2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Jost','Avenir Next',Arial,sans-serif; font-weight:300; color:var(--ink); background:#fff; line-height:1.6; letter-spacing:.01em; }
  header { border-bottom:1px solid var(--line); }
  .wrap { max-width:980px; margin:0 auto; padding:0 20px; }
  header { position:relative; }
  header .wrap { position:relative; }
  .head-right { display:flex; align-items:center; gap:18px; }
  .burger { display:flex; width:28px; height:20px; padding:0; flex-direction:column; justify-content:space-between; border:0; background:none; cursor:pointer; }
  .burger span { display:block; width:100%; height:2px; background:var(--ink); }
  .burger-menu { position:absolute; top:100%; right:20px; z-index:60; display:flex; min-width:200px; margin-top:6px; padding:14px 22px; flex-direction:column; gap:10px; border:1px solid var(--line); border-radius:12px; background:#fff; box-shadow:0 10px 30px rgb(0 0 0 / 10%); }
  .burger-menu[hidden] { display:none; }
  .burger-menu a { color:var(--ink); font-size:13px; font-weight:500; letter-spacing:.14em; text-decoration:none; text-transform:uppercase; }
  .burger-menu a:hover, .burger-menu a[aria-current="page"] { color:var(--accent); }
  .menu-divider { height:1px; background:var(--line); }
  header .wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:68px; flex-wrap:wrap; }
  .brand { font-size:13px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; }
  h2 { margin:0 0 14px; font-size:15px; font-weight:400; letter-spacing:.14em; text-transform:uppercase; }
  main { padding:24px 20px 70px; }
  .nav { display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .nav button { font:inherit; font-weight:500; font-size:13px; letter-spacing:.14em; text-transform:uppercase; background:none; border:0; border-bottom:2px solid transparent; padding:10px 14px; cursor:pointer; color:var(--soft); }
  .nav button.on { color:var(--accent); border-color:var(--accent); }
  .count { background:var(--warn-bg); color:var(--warn); border-radius:10px; font-size:11px; padding:1px 8px; margin-left:6px; }
  .btn { font:inherit; font-weight:500; font-size:12px; letter-spacing:.12em; text-transform:uppercase; border-radius:8px; padding:8px 14px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink); text-decoration:none; display:inline-block; }
  .btn:hover { background:var(--alt); }
  .btn.go { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { color:var(--bad); }
  input, select { font:inherit; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
  label { font-size:13px; color:var(--soft); display:block; margin-bottom:4px; }
  .card { border:1px solid var(--line); background:var(--alt); border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap; }
  .name { font-weight:500; font-size:17px; }
  .meta { color:var(--soft); font-size:14px; margin-top:2px; white-space:pre-line; overflow-wrap:anywhere; }
  .badge { font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:999px; }
  .pending { background:var(--warn-bg); color:var(--warn); } .confirmed { background:var(--ok-bg); color:var(--ok); }
  .declined, .cancelled { background:var(--bad-bg); color:var(--bad); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .grid { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; }
  #msg { min-height:22px; font-size:14px; margin:0 0 12px; } #msg.bad { color:var(--bad); } #msg.ok { color:var(--ok); }
  .empty { color:var(--soft); padding:30px 0; text-align:center; }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/" style="color:inherit;text-decoration:none">Kelly Mushonga · Admin</a>
  <span class="head-right"><a class="btn" href="/api/admin/export.csv">Export CSV</a>
    <button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="burger-menu"><span></span><span></span><span></span></button>
  </span>
  <nav id="burger-menu" class="burger-menu" hidden>
    <a href="/">Home</a><a href="/#about">About</a><a href="/#services">Services</a><a href="/#portfolio">Portfolio</a><a href="/#book">Book</a><a href="/#contact">Contact</a>
    <span class="menu-divider"></span>
    <a href="/admin" aria-current="page">Admin</a>
  </nav>
</div></header>
<main class="wrap">
  <div class="nav" role="tablist">
    <button data-tab="bookings" class="on">Bookings<span class="count" id="pendingCount" hidden>0</span></button>
    <button data-tab="availability">Availability</button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>

  <section id="tab-bookings">
    <div class="filters">
      <label for="statusFilter" style="margin:0">Show</label>
      <select id="statusFilter">
        <option value="open">Pending &amp; confirmed</option>
        <option value="pending">Pending only</option>
        <option value="all">Everything</option>
      </select>
    </div>
    <div id="list"></div>
  </section>

  <section id="tab-availability" hidden>
    <h2>Bookings per time slot</h2>
    <div class="grid">
      <div><label for="cap">Limit (1 = one client per time)</label><input id="cap" type="number" min="1" max="20" style="width:120px"></div>
      <button class="btn go" id="saveCap" type="button">Save</button>
    </div>
    <h2>Block time off</h2>
    <div class="grid">
      <div><label for="blDate">Date</label><input id="blDate" type="date"></div>
      <div><label for="blTime">Time</label><select id="blTime"></select></div>
      <div><label for="blReason">Note (optional)</label><input id="blReason" maxlength="120"></div>
      <button class="btn go" id="addBlock" type="button">Block</button>
    </div>
    <div id="blocks"></div>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { bookings: [], services: {}, blocks: [], times: [] };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); };

  function msg(t, ok) { var m = $("msg"); m.textContent = t || ""; m.className = ok ? "ok" : t ? "bad" : ""; }
  function api(path, method, body) {
    var opts = { method: method || "GET", headers: {} };
    if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || "Request failed"); return d; });
    });
  }
  function fail(e) { msg(e.message); }
  function pretty(d) { return new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }); }
  function clock(t) { var p = t.split(":"), h = +p[0]; return (h % 12 || 12) + ":" + p[1] + (h < 12 ? " am" : " pm"); }

  function load() {
    return Promise.all([api("/api/admin/bookings"), api("/api/admin/blocks")]).then(function (r) {
      state.bookings = r[0].bookings; state.services = r[0].services; state.prices = r[0].prices; state.blocks = r[1].blocks; state.times = r[1].times;
      $("cap").value = r[0].capacity;
      $("blTime").innerHTML = '<option value="">All day</option>' + state.times.map(function (t) { return '<option value="' + t + '">' + clock(t) + "</option>"; }).join("");
      render();
    }).catch(fail);
  }

  function render() {
    var f = $("statusFilter").value;
    var pending = state.bookings.filter(function (b) { return b.status === "pending"; }).length;
    $("pendingCount").hidden = !pending; $("pendingCount").textContent = pending;
    var rows = state.bookings.filter(function (b) {
      return f === "all" || (f === "pending" ? b.status === "pending" : b.status === "pending" || b.status === "confirmed");
    });
    $("list").innerHTML = rows.length ? rows.map(card).join("") : '<p class="empty">No bookings here yet.</p>';
    $("blocks").innerHTML = state.blocks.length ? state.blocks.map(function (b) {
      return '<div class="card row"><div><div class="name">' + esc(pretty(b.date)) + " · " + (b.time ? clock(b.time) : "All day") + '</div><div class="meta">' + esc(b.reason) + '</div></div><button class="btn danger" data-unblock="' + b.id + '" type="button">Remove</button></div>';
    }).join("") : '<p class="empty">Nothing blocked.</p>';
  }

  function card(b) {
    var btns = [];
    if (b.status === "pending") btns.push(["confirmed", "Confirm", "go"], ["declined", "Decline", "danger"]);
    else if (b.status === "confirmed") btns.push(["cancelled", "Cancel", "danger"]);
    else btns.push(["pending", "Reopen", ""]);
    var price = state.prices && state.prices[b.service];
    var paidBtn = price ? '<button class="btn ' + (b.paid ? "" : "go") + '" data-id="' + b.id + '" data-paid="' + (b.paid ? 0 : 1) + '" type="button">' + (b.paid ? "Mark unpaid" : "Mark paid") + "</button>" : "";
    var paidBadge = price ? ' <span class="badge ' + (b.paid ? "confirmed" : "pending") + '">' + (b.paid ? "paid $" : "unpaid $") + price + "</span>" : "";
    return '<div class="card"><div class="row"><div><div class="name">' + esc(b.name) + '</div>' +
      '<div class="meta">' + esc(state.services[b.service] || b.service) + " · " + esc(pretty(b.date)) + " at " + clock(b.time) + "\n" +
      '<a href="mailto:' + esc(b.email) + '">' + esc(b.email) + "</a>" + (b.phone ? " · " + esc(b.phone) : "") + (b.notes ? "\n" + esc(b.notes) : "") + '</div></div>' +
      '<span class="badge ' + esc(b.status) + '">' + esc(b.status) + '</span>' + paidBadge + '</div><div class="actions">' + paidBtn +
      btns.map(function (x) { return '<button class="btn ' + x[2] + '" data-id="' + b.id + '" data-status="' + x[0] + '" type="button">' + x[1] + "</button>"; }).join("") + "</div></div>";
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.tab) {
      document.querySelectorAll(".nav button").forEach(function (b) { b.classList.toggle("on", b === t); });
      $("tab-bookings").hidden = t.dataset.tab !== "bookings"; $("tab-availability").hidden = t.dataset.tab !== "availability"; msg("");
    } else if (t.dataset.status) {
      api("/api/admin/bookings/" + t.dataset.id + "/status", "POST", { status: t.dataset.status }).then(function () { msg(""); return load(); }).catch(fail);
    } else if (t.dataset.paid) {
      api("/api/admin/bookings/" + t.dataset.id + "/paid", "POST", { paid: t.dataset.paid === "1" }).then(load).catch(fail);
    } else if (t.dataset.unblock) {
      api("/api/admin/blocks/" + t.dataset.unblock, "DELETE").then(load).catch(fail);
    }
  });
  $("statusFilter").addEventListener("change", render);
  $("saveCap").addEventListener("click", function () {
    api("/api/admin/settings", "POST", { capacity: Number($("cap").value) }).then(function () { msg("Saved.", true); return load(); }).catch(fail);
  });
  $("addBlock").addEventListener("click", function () {
    if (!$("blDate").value) return msg("Pick a date to block.");
    api("/api/admin/blocks", "POST", { date: $("blDate").value, time: $("blTime").value, reason: $("blReason").value })
      .then(function () { $("blReason").value = ""; msg("Blocked.", true); return load(); }).catch(fail);
  });
  var burger = document.querySelector(".burger"), menu = $("burger-menu");
  burger.addEventListener("click", function () { var open = menu.hidden; menu.hidden = !open; burger.setAttribute("aria-expanded", open); });
  document.addEventListener("click", function (e) {
    if (!menu.hidden && !e.target.closest(".burger, .burger-menu")) { menu.hidden = true; burger.setAttribute("aria-expanded", "false"); }
  });
  load();
})();
</script>
</body>
</html>
